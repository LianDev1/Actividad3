<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 3 - Componente Modal JS</title>
  <link rel="stylesheet" href="css/componentes.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #e1e4e8;
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: #111827;
    }

    p {
      font-size: 0.95rem;
      color: #6b7280;
    }

    .panel-botones {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn-demo {
      padding: 9px 15px;
      font-size: 0.875rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }

    .btn-blue { background-color: #2563eb; }
    .btn-red { background-color: #dc2626; }
    .btn-green { background-color: #16a34a; }

    .btn-demo:hover { opacity: 0.9; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .form-group input {
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Componente Visual: Ventana Modal</h1>
    <p>Librería reutilizable en JavaScript Vanilla para la creación de modales interactivos.</p>

    <div class="panel-botones">
      <button class="btn-demo btn-blue" id="btn-info">Abrir Informativo</button>
      <button class="btn-demo btn-red" id="btn-confirm">Abrir Confirmación</button>
      <button class="btn-demo btn-green" id="btn-form">Abrir Formulario</button>
    </div>
  </div>

  <script src="js/componente.js"></script>
  <script>
    document.getElementById('btn-info').addEventListener('click', () => {
      Modal.abrir({
        titulo: 'Informacion del Sistema',
        contenido: 'Los cambios fueron guardados exitosamente en la base de datos.',
        botones: [
          { texto: 'Entendido', tipo: 'primary' }
        ]
      });
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
      Modal.abrir({
        titulo: 'Confirmar Eliminacion',
        contenido: '¿Esta seguro de que desea eliminar este registro? Esta accion no se puede deshacer.',
        botones: [
          { texto: 'Cancelar', tipo: 'secondary' },
          {
            texto: 'Eliminar',
            tipo: 'danger',
            onClick: (m) => {
              alert('Registro eliminado.');
              m.close();
            }
          }
        ]
      });
    });

    document.getElementById('btn-form').addEventListener('click', () => {
      Modal.abrir({
        titulo: 'Suscripcion al Boletin',
        contenido: `
          <div class="form-group">
            <label for="txt-email">Correo electronico:</label>
            <input type="email" id="txt-email" placeholder="usuario@dominio.com">
          </div>
        `,
        botones: [
          { texto: 'Cancelar', tipo: 'secondary' },
          {
            texto: 'Guardar',
            tipo: 'success',
            onClick: (m) => {
              const email = document.getElementById('txt-email').value;
              if (email) {
                alert('Correo registrado: ' + email);
                m.close();
              } else {
                alert('Ingrese un correo valido.');
              }
            }
          }
        ]
      });
    });
  </script>
</body>
</html>
